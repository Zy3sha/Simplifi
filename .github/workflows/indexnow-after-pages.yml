name: IndexNow after Pages deployment

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: indexnow-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  submit:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Notify IndexNow about changed canonical pages
        run: node .github/scripts/indexnow-submit.mjs
