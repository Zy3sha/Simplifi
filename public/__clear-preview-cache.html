<!doctype html>
<meta charset="utf-8">
<title>Refreshing preview</title>
<body style="font-family:system-ui,sans-serif;padding:24px;color:#3f3338">
  Refreshing preview...
  <script>
    (async function () {
      try {
        if ("serviceWorker" in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((reg) => reg.unregister()));
        }
      } catch (_) {}
      try {
        if ("caches" in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => caches.delete(key)));
        }
      } catch (_) {}
      location.replace("/?v=1778122752&fresh=" + Date.now());
    }());
  </script>
</body>
