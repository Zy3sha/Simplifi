<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:1200px;height:630px;overflow:hidden}
    body{font-family:"Avenir Next",Avenir,Arial,sans-serif;background:#07152f;color:#fff4dd}
    .card{position:relative;width:1200px;height:630px;overflow:hidden;background:
      radial-gradient(circle at 83% 34%,rgba(71,106,181,.48),transparent 310px),
      radial-gradient(circle at 14% 10%,rgba(244,197,109,.12),transparent 250px),
      linear-gradient(135deg,#020a1c 0%,#081b3d 62%,#061329 100%)}
    .glow{position:absolute;border-radius:50%;background:#f4c56d;box-shadow:0 0 19px 5px rgba(244,197,109,.66)}
    .g1{left:74px;top:74px;width:8px;height:8px}.g2{left:1085px;top:92px;width:6px;height:6px}.g3{left:1118px;top:514px;width:8px;height:8px}.g4{left:561px;top:556px;width:7px;height:7px}
    .content{position:absolute;left:72px;top:57px;width:705px;z-index:2}
    .brand{font-family:Georgia,"Times New Roman",serif;font-style:italic;color:#ffe199;font-size:54px;line-height:1;letter-spacing:-2px}
    .eyebrow{margin-top:35px;color:#f4c56d;font-size:17px;font-weight:800;letter-spacing:3.2px;text-transform:uppercase}
    h1{margin:15px 0 18px;font-family:Georgia,"Times New Roman",serif;font-size:54px;line-height:1.09;letter-spacing:-1.6px;max-width:690px}
    .sub{margin:0;max-width:655px;color:#dce4f5;font-size:24px;line-height:1.42;font-weight:500}
    .chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px;width:665px}
    .chip{padding:10px 16px;border:1px solid rgba(244,197,109,.35);border-radius:999px;background:rgba(255,255,255,.055);color:#fff0d2;font-size:16px;font-weight:700}
    .footer{position:absolute;left:72px;bottom:18px;display:flex;align-items:center;gap:16px;color:#f7d88e;font-size:20px;font-weight:800}
    .dot{width:6px;height:6px;border-radius:50%;background:#f4c56d;box-shadow:0 0 10px #f4c56d}
    .art-wrap{position:absolute;right:-25px;bottom:-192px;width:495px;height:742px;z-index:1;filter:drop-shadow(0 18px 34px rgba(0,0,0,.35))}
    .art{width:100%;height:100%;object-fit:contain}
    .ring{position:absolute;right:58px;top:62px;width:364px;height:364px;border:2px solid rgba(244,197,109,.43);border-radius:50%;box-shadow:0 0 60px rgba(244,197,109,.1)}
  </style>
</head>
<body>
  <main class="card" aria-label="OBubba pregnancy and baby app privacy checklist social preview">
    <i class="glow g1"></i><i class="glow g2"></i><i class="glow g3"></i><i class="glow g4"></i>
    <div class="ring"></div>
    <section class="content">
      <div class="brand">OBubba</div>
      <div class="eyebrow">Pregnancy + baby app privacy</div>
      <h1>8 questions before you trust an app with the family record</h1>
      <p class="sub">Look past “private”. Check where the record goes, who can see it, and whether you can take it back.</p>
      <div class="chips" aria-hidden="true">
        <span class="chip">Accounts</span><span class="chip">Cloud</span><span class="chip">Sharing</span><span class="chip">AI</span>
        <span class="chip">Analytics</span><span class="chip">Location</span><span class="chip">Export</span><span class="chip">Deletion</span>
      </div>
    </section>
    <div class="footer"><span>Free checklist</span><i class="dot"></i><span>obubba.com</span></div>
    <div class="art-wrap"><img class="art" src="/obubba-thinking.png" alt=""></div>
  </main>
</body>
</html>
