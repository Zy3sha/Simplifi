<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #07111d;
      }

      body {
        font-family: Inter, "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #f7f1e8;
      }

      .ad {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        padding: clamp(42px, 5.5vw, 74px);
        background:
          radial-gradient(circle at 14% 9%, rgba(227, 160, 134, 0.26), transparent 32%),
          radial-gradient(circle at 88% 12%, rgba(131, 211, 177, 0.18), transparent 30%),
          radial-gradient(circle at 16% 86%, rgba(167, 138, 197, 0.18), transparent 30%),
          linear-gradient(180deg, #07111d 0%, #0a1725 56%, #030a13 100%);
      }

      .brand-row {
        position: relative;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }

      .brand-lockup {
        display: flex;
        align-items: center;
        gap: clamp(12px, 1.7vw, 18px);
      }

      .icon {
        width: clamp(64px, 8vw, 88px);
        height: clamp(64px, 8vw, 88px);
        border-radius: 24%;
        box-shadow: 0 22px 50px rgba(0, 0, 0, 0.28);
      }

      .brand {
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(38px, 5vw, 56px);
        line-height: 1;
        font-weight: 700;
      }

      .pill {
        min-height: clamp(42px, 5vw, 54px);
        padding: 12px 22px;
        border-radius: 999px;
        border: 1px solid rgba(227, 160, 134, 0.62);
        background: rgba(255, 255, 255, 0.1);
        color: #f7f1e8;
        font-size: clamp(20px, 2.7vw, 28px);
        line-height: 1;
        font-weight: 900;
        white-space: nowrap;
      }

      .copy {
        position: relative;
        z-index: 4;
        margin-top: clamp(58px, 9vw, 112px);
        max-width: min(850px, 78vw);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        min-height: clamp(42px, 4.8vw, 54px);
        padding: 12px 22px;
        border-radius: 999px;
        color: #f7d08c;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(184, 124, 104, 0.5);
        font-size: clamp(20px, 2.7vw, 28px);
        line-height: 1;
        font-weight: 950;
      }

      h1 {
        margin: clamp(18px, 2.5vw, 28px) 0 0;
        max-width: 900px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(58px, 7.7vw, 88px);
        line-height: 1;
        letter-spacing: 0;
        color: #f7f1e8;
      }

      .answer {
        display: block;
        margin-top: clamp(22px, 3vw, 32px);
        color: #83d3b1;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(76px, 10vw, 112px);
        line-height: 0.9;
        font-weight: 800;
      }

      .sub {
        margin: clamp(22px, 3vw, 30px) 0 0;
        max-width: 690px;
        color: #cbd3de;
        font-size: clamp(30px, 3.8vw, 42px);
        line-height: 1.12;
        font-weight: 900;
      }

      .phone {
        position: absolute;
        right: clamp(18px, 4vw, 58px);
        bottom: clamp(165px, 17vh, 230px);
        z-index: 2;
        width: clamp(250px, 31vw, 346px);
        height: clamp(442px, 55vw, 610px);
        padding: 18px;
        border-radius: 50px;
        border: 2px solid rgba(227, 160, 134, 0.54);
        background: linear-gradient(180deg, #293445, #151c28);
        box-shadow: 0 30px 82px rgba(0, 0, 0, 0.42);
        transform: rotate(3deg);
        opacity: 0.38;
      }

      .screen {
        width: 100%;
        height: 100%;
        border-radius: 36px;
        object-fit: cover;
        object-position: 50% 0%;
        filter: saturate(0.92) brightness(0.74);
      }

      .baby {
        position: absolute;
        right: clamp(36px, 5vw, 62px);
        bottom: clamp(105px, 10vh, 148px);
        z-index: 5;
        width: clamp(150px, 17vw, 190px);
        filter: drop-shadow(0 24px 42px rgba(0, 0, 0, 0.28));
      }

      .footer {
        position: absolute;
        left: clamp(42px, 5.5vw, 74px);
        right: clamp(42px, 5.5vw, 74px);
        bottom: clamp(56px, 7.5vh, 112px);
        z-index: 6;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }

      .cta {
        color: #07111d;
        background: #f7f1e8;
        border: 2px solid rgba(247, 208, 140, 0.85);
        border-radius: 999px;
        padding: clamp(18px, 2.4vw, 24px) clamp(28px, 3.8vw, 38px);
        font-size: clamp(26px, 3.1vw, 34px);
        line-height: 1;
        font-weight: 1000;
        box-shadow: 0 22px 52px rgba(0, 0, 0, 0.28);
      }

      .stores {
        color: #f7f1e8;
        font-size: clamp(22px, 2.7vw, 30px);
        font-weight: 950;
        text-align: right;
      }

      .textonly .phone,
      .textonly .baby {
        display: none;
      }

      .textonly .copy {
        max-width: min(930px, 86vw);
      }

      .textonly .sub {
        max-width: 820px;
      }

      .textonly .answer {
        color: #f7d08c;
      }

      .understand .answer {
        max-width: 640px;
        font-size: clamp(58px, 7vw, 78px);
        line-height: 1;
      }

      .understand .sub {
        max-width: 620px;
      }

      .square .copy {
        margin-top: clamp(48px, 7vw, 72px);
        max-width: 860px;
      }

      .square h1 {
        font-size: clamp(54px, 7.3vw, 76px);
      }

      .square .phone {
        right: 26px;
        bottom: 142px;
        width: 274px;
        height: 484px;
        opacity: 0.3;
      }

      .square .baby {
        width: 154px;
        bottom: 96px;
      }

      .story .copy {
        margin-top: clamp(120px, 13vh, 190px);
        max-width: 900px;
      }

      .story h1 {
        font-size: clamp(72px, 8.4vw, 96px);
      }

      .story .sub {
        max-width: 780px;
        font-size: clamp(36px, 4.2vw, 48px);
      }

      .story .phone {
        right: 48px;
        bottom: 210px;
        width: 360px;
        height: 636px;
        opacity: 0.34;
      }

      .story .baby {
        width: 214px;
        bottom: 150px;
      }

      .landscape {
        padding: 42px 54px;
      }

      .landscape .copy {
        margin-top: 34px;
        max-width: 650px;
      }

      .landscape h1 {
        font-size: 47px;
        max-width: 620px;
      }

      .landscape .answer {
        display: block;
        margin-top: 14px;
        font-size: 58px;
      }

      .landscape .sub {
        display: none;
      }

      .landscape .phone {
        right: 64px;
        bottom: 82px;
        width: 236px;
        height: 416px;
        opacity: 0.42;
      }

      .landscape .baby {
        right: 42px;
        bottom: 48px;
        width: 132px;
      }

      .landscape .footer {
        left: 54px;
        right: 54px;
        bottom: 34px;
      }

      .landscape .cta {
        font-size: 24px;
        padding: 16px 28px;
      }

      .landscape .stores {
        font-size: 22px;
      }
    </style>
  </head>
  <body>
    <main class="ad" id="ad">
      <header class="brand-row">
        <div class="brand-lockup">
          <img class="icon" src="../assets/icon.png" alt="" />
          <div class="brand">OBubba</div>
        </div>
        <div class="pill">Free to start</div>
      </header>

      <section class="copy">
        <div class="eyebrow" id="eyebrow">Sleep tracking should do more</div>
        <h1 id="headline">Does your baby tracker actually help with sleep?</h1>
        <div class="answer" id="answer">No?</div>
        <p class="sub" id="subline">Try OBubba for 7 nights. Mums tell us their babies are sleeping better.</p>
      </section>

      <div class="phone">
        <img class="screen" src="../assets/ui-captures/15-dashboard.png" alt="" />
      </div>

      <img class="baby" src="../assets/sleep-baby.png" alt="" />

      <footer class="footer">
        <div class="cta" id="cta">Download free</div>
        <div class="stores">iPhone + Android</div>
      </footer>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const variant = params.get("variant") || "proof";
      const size = params.get("size") || "feed";

      const copy = {
        proof: {
          eyebrow: "Sleep tracking should do more",
          headline: "Does your baby tracker actually help with sleep?",
          answer: "No?",
          subline: "Try OBubba for 7 nights. Mums tell us their babies are sleeping better.",
          cta: "Download free",
        },
        understand: {
          eyebrow: "Most trackers stop too soon",
          headline: "Most baby trackers record the bad night.",
          answer: "OBubba helps you understand it.",
          subline: "It learns feeds, naps, wake windows and bedtime rhythm from your real logs.",
          cta: "Try OBubba free",
        },
        textonly: {
          eyebrow: "Parent proof",
          headline: "Mums tell us their babies are sleeping better.",
          answer: "Try OBubba for a week.",
          subline: "It learns your baby's feeds, naps, wake windows and bedtime rhythm.",
          cta: "Start with one log",
        },
      };

      const selected = copy[variant] || copy.proof;
      for (const [key, value] of Object.entries(selected)) {
        document.getElementById(key).textContent = value;
      }

      document.getElementById("ad").classList.add(size);
      if (variant === "textonly") {
        document.getElementById("ad").classList.add("textonly");
      }
      if (variant === "understand") {
        document.getElementById("ad").classList.add("understand");
      }
    </script>
  </body>
</html>
