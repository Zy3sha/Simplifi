      var playStoreUrl = "https://play.google.com/store/apps/details?id=com.obubba.app";
      var host = (window.location.hostname || "").toLowerCase();
      var path = (window.location.pathname || "/").replace(/\/+$/, "") || "/";
      var params = window.location.search || "";
      var publicRoot = (host === "obubba.com" || host === "www.obubba.com") && (path === "/" || path === "/index.html");
      var previewRoot = params.indexOf("ob-download-preview=1") !== -1;

      window.__OBUBBA_DOWNLOAD_LANDING__ = publicRoot || previewRoot;
      window.__OBUBBA_STORE_LINKS__ = { ios: appStoreUrl, android: playStoreUrl };
      window.__OBUBBA_STORE_URL_FOR_DEVICE__ = function () {
        var ua = "";
        var platform = "";
        try { ua = navigator.userAgent || ""; } catch (e) {}
        try { platform = navigator.userAgentData && navigator.userAgentData.platform || navigator.platform || ""; } catch (e) {}
        if (/android/i.test(ua) || /android/i.test(platform)) return playStoreUrl;
        if (/iphone|ipad|ipod/i.test(ua)) return appStoreUrl;
        try {
          if (/mac/i.test(platform) && navigator.maxTouchPoints > 1) return appStoreUrl;
        } catch (e) {}
        return appStoreUrl;
      };
    })();
  </script>

<script>
  (function () {
    if (!window.__OBUBBA_DOWNLOAD_LANDING__) return;
    document.documentElement.style.background = "#F0DDD6";
    document.body.style.background = "#F0DDD6";
    var landing = document.getElementById("ob-download-landing");
    var appShell = document.getElementById("ob-app-shell");
    var download = document.getElementById("ob-download-now");
    if (landing) landing.hidden = false;
    if (appShell) appShell.hidden = true;
    if (download && window.__OBUBBA_STORE_URL_FOR_DEVICE__) {
      download.href = window.__OBUBBA_STORE_URL_FOR_DEVICE__();
      download.addEventListener("click", function () {
        download.href = window.__OBUBBA_STORE_URL_FOR_DEVICE__();
      });
    }
  })();
</script>
